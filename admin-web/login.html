<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deckun Admin — Login</title>
  <meta name="api-base" content="http://127.0.0.1:65433/api" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <h1>Deckun Admin</h1>
      <p style="color:var(--color-text-muted);font-size:0.875rem;margin-top:0.5rem;">Admin Control Panel</p>
    </div>
    <form id="login-form" autocomplete="off">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="admin@deckun.in" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="login-btn">Sign In</button>
    </form>
    <div id="error-msg" class="error-message"></div>
  </div>

  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
