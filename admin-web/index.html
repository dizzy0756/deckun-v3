<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deckun Admin</title>
  <link rel="icon" type="image/png" href="../customer-web/images/logo.png" />
  <link rel="apple-touch-icon" href="../customer-web/images/logo.png" />
  <meta name="api-base" content="http://127.0.0.1:65433/api" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="#dashboard" class="logo">
        <img src="../customer-web/images/logo.png" alt="Deckun" class="logo-img" data-site-logo />
        <span>Deckun Admin</span>
      </a>
      <div class="header-actions">
        <button id="menu-btn" class="icon-btn" title="Menu" aria-label="Open navigation">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <button id="notifications-btn" class="icon-btn" title="Notifications" aria-label="Notifications" aria-haspopup="true" aria-expanded="false">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <span id="notification-badge" class="cart-badge hidden">0</span>
        </button>
        <button id="settings-btn" class="btn btn-secondary btn-sm" style="margin-right: 0.5rem;">Settings</button>
        <button id="logout-btn" class="icon-btn" title="Logout" aria-label="Logout">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <div id="notifications-panel" class="notifications-panel" role="dialog" aria-label="Notifications"></div>

  <nav class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="nav-header">
      <img src="../customer-web/images/logo.png" alt="Deckun" class="logo-img logo-img-sm" data-site-logo />
      <span>Deckun Admin</span>
      <button id="menu-close" class="icon-btn" title="Close" aria-label="Close navigation">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <ul id="nav-list" class="nav-list"></ul>
  </nav>
  <div id="nav-overlay" class="nav-overlay"></div>

  <main id="app" class="app-main">
    <div class="loading">Loadingâ€¦</div>
  </main>

  <nav class="mobile-nav">
    <a href="#dashboard" data-nav="dashboard">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" x2="21" y1="9" y2="9"/><line x1="9" x2="21" y1="21" y2="21"/></svg>
      <span>Home</span>
    </a>
    <a href="#orders" data-nav="orders">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
      <span>Orders</span>
    </a>
    <a href="#products" data-nav="products">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m20 24-14-13-14 13L1 5l15 4L23 20z"/></svg>
      <span>Products</span>
    </a>
    <a href="#inventory" data-nav="inventory">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 17h7M10 7h7M4 21l4-6 4 6 4-6"/><circle cx="5" cy="7" r="1"/><circle cx="19" cy="7" r="1"/><circle cx="5" cy="17" r="1"/><circle cx="19" cy="17" r="1"/></svg>
      <span>Inventory</span>
    </a>
    <a href="#reviews" data-nav="reviews">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s5-3 7-3 7 3 7 3-5 3-7-3z"/></svg>
      <span>Reviews</span>
    </a>
  </nav>

  <div id="toast"></div>

  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
