<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deckun Admin</title>
  <meta name="api-base" content="http://127.0.0.1:65433/api" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="#dashboard" class="logo">
        <div class="logo-mark">D</div>
        <span>Deckun Admin</span>
      </a>
      <div class="header-actions">
        <button id="notifications-btn" class="icon-btn" title="Notifications">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span id="notification-badge" class="cart-badge hidden">0</span>
          </svg>
        </button>
        <button id="logout-btn" class="icon-btn" title="Logout">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main id="app" class="app-main">
    <div class="loading">Loading…</div>
  </main>

  <nav class="mobile-nav">
    <a href="#dashboard" data-nav="dashboard">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" x2="21" y1="9" y2="9"/><line x1="9" x2="21" y1="21" y2="21"/></svg>
      <span>Home</span>
    </a>
    <a href="#orders" data-nav="orders">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
      <span>Orders</span>
    </a>
    <a href="#products" data-nav="products">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m20 24-14-13-14 13L1 5l15 4L23 20z"/></svg>
      <span>Products</span>
    </a>
    <a href="#inventory" data-nav="inventory">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 17h7M10 7h7M4 21l4-6 4 6 4-6"/><circle cx="5" cy="7" r="1"/><circle cx="19" cy="7" r="1"/><circle cx="5" cy="17" r="1"/><circle cx="19" cy="17" r="1"/></svg>
      <span>Inventory</span>
    </a>
    <a href="#reviews" data-nav="reviews">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s5-3 7-3 7 3 7 3-5 3-7-3z"/></svg>
      <span>Reviews</span>
    </a>
    <a href="#settings" data-nav="settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82-.33l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 0 2-2 2 2 0 0 0-2-2h-.09a1.65 1.65 0 0 0-1.51-1 1.65 1.65 0 0 0-1 1.51z"/></svg>
      <span>Settings</span>
    </a>
  </nav>

  <div id="toast"></div>

  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
