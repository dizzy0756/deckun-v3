# Alembic configuration.  Generated for Deckun backend.
# The *Config object implements the .ini specification for Alembic.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# max length of characters to truncate in "verbose" output
truncate_slug_length = 12

# Comment to remove the "snakeskin" prefix from migration script filenames
# revision_filename_prefix =

# Comment to remove the timestamp directory from migration script filenames
# revision_timestamp_convert = True

# sys.path here so that we can import the app
prepend_sys_path = .

# The migration script will attempt to use the sqlalchemy.url setting defined
# in the configuration file, and will use the alembic context to set the URL
# used for the migration in the env.py file.
version_path_separator = os.pathsep

# The output encoding used when revision files are written from script
# templates
output_encoding = utf-8

# SQLAlchemy URL — overridden by settings.DATABASE_URL in env.py
sqlalchemy.url = sqlite:///deckun.db

[post_write_hooks]
# format the .py files after generation
# see: https://alembic.readthedocs.io/en/latest/post_write_hooks.html

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
