services:
  - type: web
    name: deckun-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Generated once by Render; keep it secret.
      - key: SECRET_KEY
        generateValue: true
      # Set the Neon pooled connection string in the Render dashboard.
      # sync: false keeps blueprint syncs from overwriting it.
      - key: DATABASE_URL
        sync: false
